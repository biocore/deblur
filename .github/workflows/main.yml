name: "Main CI"

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.11", "3.12"]

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: deblur
          condarc: |
            channels:
              - conda-forge
              - bioconda
          create-args: >-
            python=${{ matrix.python-version }}
            pip
            h5py
            vsearch>=2.7.0
            mafft>=7.394
            sortmerna=2.0
            pytest
            pytest-cov
          init-shell: bash
          cache-environment: true
          post-cleanup: all

      - name: Show software versions
        run: |
          echo "::group::Software versions"
          python --version
          vsearch --version
          mafft --version
          micromamba list
          echo "::endgroup::"

      - name: Install deblur
        run: python -m pip install -e .

      - name: Run tests
        run: |
          pytest --doctest-modules \
                 --cov=deblur \
                 --cov-report=lcov:coverage.lcov \
                 --cov-report=term \
                 deblur

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
          flag-name: python-${{ matrix.python-version }}
          parallel: true

  coveralls_finish:
    name: Coveralls finished
    needs: main
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Close parallel Coveralls build
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint with flake8
        run: |
          python -m pip install --upgrade pip flake8
          flake8 deblur scripts/deblur setup.py
